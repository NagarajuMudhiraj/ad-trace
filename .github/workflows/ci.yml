name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest scikit-learn joblib numpy pandas

    - name: Run Test Suite (pytest)
      run: |
        pytest tests/ -v

    - name: Run Standalone CLI Inference Smoke Test
      run: |
        python models/best_validation_model/predict.py "MVLLRVLILLLSWAAGMGGQYGNPLNKYIRHYEGLSYNVDSLHQK"
